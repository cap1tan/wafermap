[project]
name = "wafermap"
version = "0.4.0"
description = "A python package to plot maps of semiconductor wafers."
authors = [
    {name = "Sotiris Thomas", email = "sothomas88@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
keywords = ["semiconductor", "wafer", "layout", "plot", "grid"]
requires-python = ">=3.10,<4.0"
dependencies = [
	"folium>=0.19.5",
	"Pillow>=12.0.0",
]

[project.optional-dependencies]
png = [
	"html2image>=2.0.3"
]
test = [
	"html2image>=2.0.3",
	"black",
	"isort",
	"flake8",
	"flake8-docstrings",
	"pytest",
	"pytest-cov",
	"pylint",
	"tox",
	"tox-poetry-installer",
	"twine"
]

[project.urls]
repository = "https://github.com/cap1tan/wafermap"
"Bug Tracker" = "https://github.com/cap1tan/wafermap/issues"

[dependency-groups]
test=[
	"html2image>=2.0.3",
	"black",
	"isort",
	"flake8",
	"flake8-docstrings",
	"pytest",
	"pytest-cov",
	"pylint",
	"tox",
	"tox-poetry-installer",
	"twine"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
