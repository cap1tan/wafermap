[project]
name = "wafermap"
version = "0.4.0"
description = "A python package to plot maps of semiconductor wafers."
authors = [
    {name = "Sotiris Thomas", email = "sothomas88@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
keywords = ["semiconductor", "wafer", "layout", "plot", "grid"]
requires-python = ">=3.10,<4.0"
dependencies = [
	"folium>=0.19.5",
	"Pillow>=12.0.0",
]

[project.optional-dependencies]
png = [
	"html2image>=2.0.3"
]
test = [
	"html2image>=2.0.3",
	"ruff",
	"ty",
	"pytest",
	"pytest-cov",
	"pylint",
	"tox",
	"tox-poetry-installer",
	"twine"
]

[project.urls]
repository = "https://github.com/cap1tan/wafermap"
"Bug Tracker" = "https://github.com/cap1tan/wafermap/issues"

[dependency-groups]
test=[
	"html2image>=2.0.3",
	"ruff",
	"ty",
	"pytest",
	"pytest-cov",
	"pylint",
	"tox",
	"tox-poetry-installer",
	"twine"
]


[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear, mccabe complexity, import sorting
select = ["E", "W", "F", "B", "C90", "I"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["wafermap"]

[tool.ty.environment]
python-version = "3.10"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
