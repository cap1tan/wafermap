[tox]
requires =
    tox>=4
env_list = lint, 3.1{1,2,3,4}
isolated_build = true

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314	

[testenv]
description = Running tests and checking coverage
package = editable
extras = test
allowlist_externals = pytest, ruff, ty, pylint, poetry, twine
commands =
    pytest tests/ -s -v --cov=wafermap --cov-append --cov-report=xml --cov-report=term-missing --import-mode importlib --cov-fail-under=80

[testenv:lint]
description = Linting, format and type checks
ignore_errors = false
commands =
    ruff check wafermap tests
    ruff format --check wafermap tests
    ty check wafermap tests
	pylint wafermap tests --fail-under=9
	poetry build
    twine check dist/*
