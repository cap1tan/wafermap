repos:
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.17.3
      hooks:
        - id: ruff-check
          args: [--fix]
        - id: ruff-format
    - repo: local
      hooks:
        - id: ty
          name: ty
          entry: ty check
          language: system
          types: [python]
          pass_filenames: false
    - repo: https://github.com/asottile/pyupgrade
      rev: v3.19.1
      hooks:
        - id: pyupgrade
